<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gaydar</title>
  <style>* { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
    .screen { background: #232323; min-height: 760px; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 36px 16px 28px; border-radius: 36px; border: 2px solid #3a3a3a; }
    .app-title { font-size: 26px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #ccc; margin-bottom: 22px; }
    .mode-tabs { display: flex; background: #888; border-radius: 12px; padding: 5px; gap: 5px; margin-bottom: 30px; border: 2px solid #aaa; }
    .tab { padding: 10px 32px; border-radius: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; border: none; background: transparent; color: #fff; transition: all 0.2s; }
    .tab.active { background: #fff; color: #111; font-weight: 800; }
    .page-link { margin-top: 28px; font-size: 13px; color: #888; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .page-link:hover { color: #ccc; }
    .view { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
    .view.visible { display: flex; }
    canvas { border-radius: 50%; display: block; }
    .radar-wrap { position: relative; width: 300px; height: 300px; cursor: pointer; }
    .compass-wrap { position: relative; width: 280px; height: 280px; cursor: pointer; user-select: none; }
    .compass-frame { width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4a4a, #1a1a1a 60%, #0d0d0d); border: 6px solid #888; box-shadow: 0 0 0 2px #555, 0 0 0 4px #333, 0 8px 32px rgba(0,0,0,0.7); position: absolute; top: 0; left: 0; transition: border-color 0.6s ease, box-shadow 0.6s ease; display: flex; align-items: center; justify-content: center; }
    .compass-frame.gay { border-color: #e05555; box-shadow: 0 0 0 3px #c03030, 0 0 0 10px rgba(220,60,60,0.35), 0 0 70px 24px rgba(220,60,60,0.55), 0 8px 32px rgba(0,0,0,0.7); }
    .compass-frame.straight { border-color: #44bb77; box-shadow: 0 0 0 3px #229955, 0 0 0 10px rgba(50,180,100,0.35), 0 0 70px 24px rgba(50,200,100,0.55), 0 8px 32px rgba(0,0,0,0.7); }
    @keyframes pulse-grey { 0% { box-shadow: 0 0 0 2px #666, 0 0 0 4px #333, 0 0 16px 4px rgba(180,180,180,0.1); } 50% { box-shadow: 0 0 0 3px #bbb, 0 0 0 12px #444, 0 0 44px 18px rgba(200,200,200,0.3); } 100% { box-shadow: 0 0 0 2px #666, 0 0 0 4px #333, 0 0 16px 4px rgba(180,180,180,0.1); } }
    .compass-frame.pulsing { animation: pulse-grey 1.1s ease-in-out infinite; border-color: #aaa; }
    .compass-frame.neutral { border-color: #888; box-shadow: 0 0 0 2px #555, 0 0 0 4px #333, 0 8px 32px rgba(0,0,0,0.7); }
    .compass-inner { width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2e2e2e, #111 70%); border: 3px solid #444; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .needle-wrap { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .needle { position: absolute; transform-origin: center center; width: 44px; height: 180px; top: calc(50% - 90px); left: calc(50% - 22px); }
    .result-text { font-size: 38px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; min-height: 50px; color: transparent; transition: color 0.5s; text-align: center; margin-top: 4px; }
    .result-text.gay { color: #ff5555; text-shadow: 0 0 16px rgba(255,80,80,0.7); }
    .result-text.straight { color: #44dd88; text-shadow: 0 0 16px rgba(50,220,120,0.7); }
    .tap-hint { font-size: 13px; color: #666; letter-spacing: 0.12em; text-transform: uppercase; }</style>
</head>
<body>
<div class="screen">
  <div class="app-title">Gaydar</div>
  <div class="mode-tabs">
    <button class="tab active" id="tabRadar" onclick="switchMode('radar')">Gaydar</button>
    <button class="tab" id="tabCompass" onclick="switchMode('compass')">Compass</button>
  </div>
  <div class="view visible" id="viewRadar">
    <div class="radar-wrap" onclick="startRadarScan()">
      <canvas id="radarCanvas" width="300" height="300"></canvas>
    </div>
    <div class="result-text" id="radarResult">&nbsp;</div>
    <div class="tap-hint" id="radarHint">Tap to scan</div>
  </div>
  <div class="view" id="viewCompass">
    <div class="compass-wrap" onclick="startCompassScan()">
      <div class="compass-frame neutral" id="compassFrame">
        <div class="compass-inner">
          <div class="needle-wrap">
            <div class="needle" id="needle"><svg viewBox="0 0 44 180" xmlns="http://www.w3.org/2000/svg" width="44" height="180"><defs><clipPath id="top-half"><rect x="0" y="0" width="44" height="90"/></clipPath><clipPath id="bot-half"><rect x="0" y="90" width="44" height="90"/></clipPath></defs><g clip-path="url(#top-half)"><path d="M22,4 L40,52 Q41,55 38,55 L28,55 L28,90 L16,90 L16,55 L6,55 Q3,55 4,52 Z" fill="#cc3333"/></g><g clip-path="url(#bot-half)"><rect x="16" y="90" width="12" height="56" fill="#888"/><path d="M16,146 L4,172 Q3,176 7,175 L22,160 L37,175 Q41,176 40,172 L28,146 Z" fill="#888"/></g><circle cx="22" cy="90" r="5" fill="#555" stroke="#333" stroke-width="1.5"/></svg></div>
          </div>
        </div>
      </div>
    </div>
    <div class="result-text" id="compassResult">&nbsp;</div>
    <div class="tap-hint" id="compassHint">Tap to scan</div>
  </div>
  <div class="page-link" onclick="window.location.href='parade.html'">🏳️‍🌈 Parade Gaydar</div>
</div>

<script>
  const canvas = document.getElementById('radarCanvas');
  const ctx = canvas.getContext('2d');
  const W=300,H=300,CX=150,CY=150,R=140;
  let radarScanning=false,radarAnimFrame=null,scanStart=null;
  let sweepAngle=-Math.PI/2,blips=[],resultBlips=[],radarResultState=null;
  let compassScanning=false,compassCurrentAngle=0;
  let beepInterval=null;

  function playSound(id){const el=document.getElementById(id);if(!el)return;el.currentTime=0;el.play().catch(()=>{});}
  function stopSound(id){const el=document.getElementById(id);if(!el)return;el.pause();el.currentTime=0;}
  function startBeepLoop(){playSound('sndBeep');beepInterval=setInterval(()=>playSound('sndBeep'),1200);}
  function stopBeepLoop(){clearInterval(beepInterval);stopSound('sndBeep');}

  function switchMode(mode){
    document.getElementById('viewRadar').classList.toggle('visible',mode==='radar');
    document.getElementById('viewCompass').classList.toggle('visible',mode==='compass');
    document.getElementById('tabRadar').className='tab'+(mode==='radar'?' active':'');
    document.getElementById('tabCompass').className='tab'+(mode==='compass'?' active':'');
    if(mode==='compass'&&!compassScanning){
      document.getElementById('compassFrame').className='compass-frame neutral';
      const needle=document.getElementById('needle');
      needle.style.transition='none';needle.style.transform='rotate(0deg)';
      compassCurrentAngle=0;
      const res=document.getElementById('compassResult');
      res.className='result-text';res.innerHTML='&nbsp;';
      document.getElementById('compassHint').textContent='Tap to scan';
    }
  }
  function drawRadarBase(){
    ctx.clearRect(0,0,W,H);ctx.save();
    ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();
    ctx.fillStyle='#071410';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,210,70,0.13)';ctx.lineWidth=0.5;
    for(let i=1;i<=4;i++){ctx.beginPath();ctx.arc(CX,CY,(R/4)*i,0,Math.PI*2);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(CX-R,CY);ctx.lineTo(CX+R,CY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(CX,CY-R);ctx.lineTo(CX,CY+R);ctx.stroke();
    ctx.beginPath();ctx.moveTo(CX-R*.707,CY-R*.707);ctx.lineTo(CX+R*.707,CY+R*.707);ctx.stroke();
    ctx.beginPath();ctx.moveTo(CX+R*.707,CY-R*.707);ctx.lineTo(CX-R*.707,CY+R*.707);ctx.stroke();
    ctx.restore();
    ctx.strokeStyle='rgba(0,200,80,0.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke();
  }
  function drawSweep(angle){
    ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();
    const span=Math.PI/3;
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,R,angle-span,angle);ctx.closePath();
    const grd=ctx.createRadialGradient(CX,CY,0,CX,CY,R);
    grd.addColorStop(0,'rgba(0,255,100,0.0)');grd.addColorStop(1,'rgba(0,255,100,0.2)');
    ctx.fillStyle=grd;ctx.fill();
    ctx.strokeStyle='rgba(0,255,100,0.95)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX+Math.cos(angle)*R,CY+Math.sin(angle)*R);ctx.stroke();
    ctx.restore();
  }
  function drawBlips(){
    const now=performance.now();blips=blips.filter(b=>now-b.born<2200);
    for(const b of blips){
      const age=(now-b.born)/2200,alpha=1-age;
      ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fillStyle=`rgba(0,255,120,${alpha})`;ctx.fill();
      ctx.beginPath();ctx.arc(b.x,b.y,4+age*10,0,Math.PI*2);ctx.strokeStyle=`rgba(0,255,120,${alpha*0.4})`;ctx.lineWidth=1;ctx.stroke();
    }
  }
  function drawResultBlips(){
    if(!resultBlips.length)return;
    const color=radarResultState==='gay'?'255,80,80':'50,220,120';
    for(const b of resultBlips){
      const pulse=0.65+0.35*Math.sin(performance.now()/300+b.phase);
      ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fillStyle=`rgba(${color},${pulse})`;ctx.fill();
      ctx.beginPath();ctx.arc(b.x,b.y,10,0,Math.PI*2);ctx.strokeStyle=`rgba(${color},${pulse*0.5})`;ctx.lineWidth=1.5;ctx.stroke();
    }
  }
  function drawCenter(){ctx.beginPath();ctx.arc(CX,CY,4,0,Math.PI*2);ctx.fillStyle='#00ff88';ctx.fill();}
  function randomBlip(angle){
    const dist=30+Math.random()*(R-40),a=angle-0.1+(Math.random()-0.5)*0.5;
    return{x:CX+Math.cos(a)*dist,y:CY+Math.sin(a)*dist,born:performance.now()};
  }
  function spawnResultBlips(n){
    resultBlips=[];
    for(let i=0;i<n;i++){
      const angle=Math.random()*Math.PI*2,dist=45+Math.random()*(R-65);
      resultBlips.push({x:CX+Math.cos(angle)*dist,y:CY+Math.sin(angle)*dist,phase:Math.random()*Math.PI*2});
    }
  }
  function idleLoop(){drawRadarBase();drawResultBlips();drawCenter();radarAnimFrame=requestAnimationFrame(idleLoop);}
  function radarLoop(ts){
    if(!scanStart)scanStart=ts;
    const elapsed=ts-scanStart;
    sweepAngle+=0.04;
    drawRadarBase();drawSweep(sweepAngle);
    if(Math.random()<0.07)blips.push(randomBlip(sweepAngle));
    drawBlips();drawCenter();
    if(elapsed<5000){radarAnimFrame=requestAnimationFrame(radarLoop);}
    else{stopBeepLoop();
  const isGay=Math.random()<0.7;
  const gayCount=isGay?Math.min(1+Math.floor(Math.random()*5),5):0;
  radarResultState=isGay?'gay':'straight';
  spawnResultBlips(gayCount);blips=[];
  const el=document.getElementById('radarResult');
  el.className='result-text '+(isGay?'gay':'straight');
  el.textContent=!isGay?'No gays around':gayCount===1?'1 gay in the area':gayCount+' gays in the area';
  document.getElementById('radarHint').textContent='Tap to scan again';
  isGay?playSound('sndGay'):playSound('sndStraight');
  radarScanning=false;idleLoop();}
  }
  function startRadarScan(){
    if(radarScanning)return;
    radarScanning=true;resultBlips=[];radarResultState=null;blips=[];scanStart=null;
    sweepAngle=-Math.PI/2;
    const el=document.getElementById('radarResult');
    el.className='result-text';el.innerHTML='&nbsp;';
    document.getElementById('radarHint').textContent='Scanning...';
    if(radarAnimFrame)cancelAnimationFrame(radarAnimFrame);
    startBeepLoop();
    radarAnimFrame=requestAnimationFrame(radarLoop);
  }
  function startCompassScan(){
    if(compassScanning)return;
    compassScanning=true;
    const frame=document.getElementById('compassFrame');
    const needle=document.getElementById('needle');
    const res=document.getElementById('compassResult');
    const hint=document.getElementById('compassHint');
    frame.className='compass-frame pulsing';
    res.className='result-text';res.innerHTML='&nbsp;';
    hint.textContent='Scanning...';
    const isGay=Math.random()<0.5;
    const finalAngle=compassCurrentAngle+6*360;
    needle.style.transition='none';
    needle.style.transform=`rotate(${compassCurrentAngle}deg)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      needle.style.transition='transform 5s cubic-bezier(0.08,0.6,0.2,1)';
      needle.style.transform=`rotate(${finalAngle}deg)`;
    }));
    setTimeout(()=>{
  compassCurrentAngle=0;needle.style.transition='none';needle.style.transform='rotate(0deg)';
  frame.className='compass-frame '+(isGay?'gay':'straight');
  res.className='result-text '+(isGay?'gay':'straight');
  res.textContent=isGay?'GAY':'STRAIGHT';
  hint.textContent='Tap to scan again';
  isGay?playSound('sndGay'):playSound('sndStraight');
  compassScanning=false;},5200);
  }
  drawRadarBase();drawCenter();
</script>
</body>
</html>
